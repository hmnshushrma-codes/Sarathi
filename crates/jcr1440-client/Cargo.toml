[package]
name = "jcr1440-client"
version = "0.1.0"
edition = "2021"
description = "Async client for JCR1440 OBD-II/GPS telematics device"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["cookies"] }
md-5 = "0.10"
quick-xml = "0.37"
regex = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
